name: Daily Gather

on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:  # 支持手动触发
  repository_dispatch:  # 支持 Cloudflare Workers 等外部触发
    types: [Daily_Gather_cf_triggerd]

concurrency:
  group: oughtgather-dedup
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check 12h cooldown for scheduled run
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Fetch the last repository_dispatch run
          LAST_RUN=$(gh run list --repo ${{ github.repository }} --workflow "${{ github.workflow }}" --event repository_dispatch --json createdAt --limit 1 --jq '.[0].createdAt' 2>/dev/null || echo "")
          
          SHOULD_RUN=$(LAST_RUN="$LAST_RUN" python3 -c "
          import os, sys, datetime
          last_run_str = os.environ.get('LAST_RUN', '')
          if not last_run_str or last_run_str == 'null' or not last_run_str.strip():
              print('true')
              sys.exit(0)
          try:
              if last_run_str.endswith('Z'):
                  last_run_str = last_run_str[:-1] + '+00:00'
              last_run = datetime.datetime.fromisoformat(last_run_str)
              now = datetime.datetime.now(datetime.timezone.utc)
              if now - last_run < datetime.timedelta(hours=12):
                  print('false')
              else:
                  print('true')
          except Exception:
              print('true')
          ")
          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT

  gather:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # 允许 push 去重文件

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # 需要写入权限来更新去重文件
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install system dependencies
        run: |
          # Configure apt-get with retries and 30s timeouts to prevent hanging on slow mirrors
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout="40" update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout="40" install -y --no-install-recommends fonts-wqy-zenhei

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare config.json
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          if [ -n "$CONFIG_JSON" ]; then
            echo "Using CONFIG_JSON from GitHub Secret"
            echo "$CONFIG_JSON" > config.json
          elif [ -f config.json ]; then
            echo "Using config.json from repository"
          else
            echo "::error::No config found. Set CONFIG_JSON secret or commit config.json to the repo."
            exit 1
          fi
          # Validate JSON
          python -c "import json; json.load(open('config.json'))" \
            || { echo "::error::config.json contains invalid JSON. Validate at https://jsonlint.com"; exit 1; }
          echo "✓ config.json is valid"

      - name: Cache dedup records
        uses: actions/cache@v4
        with:
          path: data/fetched_urls.txt
          key: ${{ runner.os }}-dedup-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-dedup-

      - name: Run Ought Gather
        env:
          # 时区设置
          TZ: Asia/Shanghai

          # SMTP 配置（必需）
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}

          # WebDAV 配置
          WEBDAV_ENABLED: ${{ secrets.WEBDAV_ENABLED }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          WEBDAV_REMOTE_PATH: ${{ secrets.WEBDAV_REMOTE_PATH }}
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}

          # 自动注入 Secrets
          OPENROUTER_API_ENDPOINT: ${{ secrets.OPENROUTER_API_ENDPOINT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          QWEATHER_HOST: ${{ secrets.QWEATHER_HOST }}
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          RAINDROPIO_API_KEY: ${{ secrets.RAINDROPIO_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TESTMAIL_APP_API_KEY: ${{ secrets.TESTMAIL_APP_API_KEY }}

        run: |
          python src/main.py

      - name: Upload EPUB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epub-files
          path: output/*.epub
          retention-days: 7

      - name: Upload dedup records
        # 上传去重数据文件（data/fetched_urls.txt），便于排查去重命中情况、手动比对历史
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dedup-records
          path: data/fetched_urls.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload logs
        # 无论成功或失败都上传运行日志（含去重检查 / 标记 / 保存等条目），便于下载排查
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/*.log
          if-no-files-found: ignore
          retention-days: 7
