name: Daily Gather

on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:  # 支持手动触发
  repository_dispatch:  # 支持 Cloudflare Workers 等外部触发
    types: [Daily_Gather_cf_triggerd]

concurrency:
  group: oughtgather-dedup
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check 12h cooldown for scheduled run
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Fetch the last repository_dispatch run
          LAST_RUN=$(gh run list --repo ${{ github.repository }} --workflow "${{ github.workflow }}" --event repository_dispatch --json createdAt --limit 1 --jq '.[0].createdAt' 2>/dev/null || echo "")
          
          SHOULD_RUN=$(LAST_RUN="$LAST_RUN" python3 -c "
          import os, sys, datetime
          last_run_str = os.environ.get('LAST_RUN', '')
          if not last_run_str or last_run_str == 'null' or not last_run_str.strip():
              print('true')
              sys.exit(0)
          try:
              if last_run_str.endswith('Z'):
                  last_run_str = last_run_str[:-1] + '+00:00'
              last_run = datetime.datetime.fromisoformat(last_run_str)
              now = datetime.datetime.now(datetime.timezone.utc)
              if now - last_run < datetime.timedelta(hours=12):
                  print('false')
              else:
                  print('true')
          except Exception:
              print('true')
          ")
          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT

  gather:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          # 需要写入权限来更新去重文件
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Cache Playwright browsers
        # Playwright 安装与缓存说明见 docs/PLAYWRIGHT.md。
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install-deps chromium

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Prepare config.json
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          if [ -n "$CONFIG_JSON" ]; then
            echo "Using CONFIG_JSON from GitHub Secret"
            echo "$CONFIG_JSON" > config.json
          elif [ -f config.json ]; then
            echo "Using config.json from repository"
          else
            echo "::error::No config found. Set CONFIG_JSON secret or commit config.json to the repo."
            exit 1
          fi
          # Validate JSON
          python -c "import json; json.load(open('config.json'))" \
            || { echo "::error::config.json contains invalid JSON. Validate at https://jsonlint.com"; exit 1; }
          echo "✓ config.json is valid"

      - name: Cache dedup records
        uses: actions/cache@v5
        with:
          path: data/fetched_urls.txt
          key: ${{ runner.os }}-dedup-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-dedup-

      - name: Run Ought Gather
        env:
          # 时区设置
          TZ: Asia/Shanghai

          # SMTP 配置（必需）
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}

          # WebDAV 配置
          WEBDAV_ENABLED: ${{ secrets.WEBDAV_ENABLED }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          WEBDAV_REMOTE_PATH: ${{ secrets.WEBDAV_REMOTE_PATH }}
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}

          # 自动注入 Secrets
          OPENROUTER_API_ENDPOINT: ${{ secrets.OPENROUTER_API_ENDPOINT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          QWEATHER_HOST: ${{ secrets.QWEATHER_HOST }}
          QWEATHER_KEY: ${{ secrets.QWEATHER_KEY }}
          RAINDROPIO_API_KEY: ${{ secrets.RAINDROPIO_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TESTMAIL_APP_API_KEY: ${{ secrets.TESTMAIL_APP_API_KEY }}

        run: |
          python -u src/main.py

      - name: Upload EPUB artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: epub-files
          path: output/*.epub
          retention-days: 7

      - name: Upload dedup records
        # 上传去重数据文件（data/fetched_urls.txt），仅在失败或手动触发时执行，便于排查
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: dedup-records
          path: data/fetched_urls.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload logs
        # 仅在失败或手动触发时上传运行日志，节省正常定时运行的 Artifact 开销与时间
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: logs
          path: logs/*.log
          if-no-files-found: ignore
          retention-days: 3
